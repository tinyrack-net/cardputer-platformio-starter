; PlatformIO Project Configuration File
;
; M5Stack Cardputer — M5Cardputer-UserDemo (mooncake app framework)
; Built with ESP-IDF v4.4.6 instead of Arduino.

[platformio]
; Keep the upstream M5Cardputer-UserDemo layout: `main/` is the ESP-IDF
; project component, `components/` holds project components.
src_dir = main

[env:m5stack-cardputer]
; PlatformIO 6.6.0 is the newest platform release that pairs ESP-IDF v4.4.x
; with the GCC 8.4 toolchain ESP-IDF v4.4 expects (newer platforms force the
; GCC 13 toolchain, which does not build ESP-IDF v4.4).
platform = espressif32@6.6.0
; ESP-IDF v4.4.6 - the exact version the upstream M5Cardputer-UserDemo uses
platform_packages =
    platformio/framework-espidf@~3.40406.0
    ; GCC 8.4 toolchain that ESP-IDF v4.4 expects (PlatformIO would otherwise
    ; pick the GCC 12.2 optional variant, which ESP-IDF v4.4 rejects)
    espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5

; ESP32-S3FN8: 8 MB flash, no PSRAM
board = esp32-s3-devkitc-1
framework = espidf

; Use the upstream partition layout (4 MB app + 1 MB FAT storage).
; Without this PlatformIO would generate and flash its default
; single-app partition table, and the 3 MB firmware would not boot.
board_build.partitions = partitions.csv

upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ESP32-S3 boards connected through the built-in USB-Serial/JTAG port stay in
; download mode after esptool's default core reset. This hook ends the upload with
; a full system reset (RTC watchdog) so the flashed firmware actually starts, and
; re-attaches the board to WSL if the USB device re-enumerates.
; See scripts/pio_app_boot.py for details. `pio run -t appboot` runs it on demand.
extra_scripts = post:scripts/pio_app_boot.py
